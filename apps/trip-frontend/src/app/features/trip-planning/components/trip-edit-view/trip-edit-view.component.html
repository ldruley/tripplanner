@if (isLoading()) {
  <div class="flex justify-center items-center h-64 animate-fade-in-fast">
    <p class="text-lg text-tp-text-light-secondary dark:text-tp-text-secondary">
      Loading trip data...
    </p>
  </div>
} @else if (trip()) {
  <div class="container mx-auto p-4 md:p-6 pb-20 md:pb-24 trip-edit-container">

    <!-- Trip Edit Controls -->
    <div class="mb-6 trip-edit-controls">
      <!-- Mobile: Full width -->
      <div class="md:hidden">
        <app-trip-edit-controls
          [trip]="trip()"
          [disabled]="isLoading()"
          (tripDataChanged)="onTripDataChanged($event)"
        />
      </div>

      <!-- Desktop: Aligned with itinerary column -->
      <div class="hidden md:flex gap-6 transition-all duration-300 ease-in-out">
        <!-- Empty space for bank when visible -->
        <div class="transition-all duration-300 ease-in-out" [ngClass]="{'w-1/3': !isLocationBankEmpty(), 'w-0': isLocationBankEmpty(), 'opacity-0': isLocationBankEmpty(), 'overflow-hidden': isLocationBankEmpty()}">
        </div>

        <!-- Trip controls aligned with itinerary -->
        <div class="transition-all duration-300 ease-in-out" [ngClass]="{'w-2/3': !isLocationBankEmpty(), 'w-full': isLocationBankEmpty()}">
          <app-trip-edit-controls
            [trip]="trip()"
            [disabled]="isLoading()"
            (tripDataChanged)="onTripDataChanged($event)"
          />
        </div>
      </div>
    </div>


    <!-- Mobile Navigation Buttons -->
    <div class="flex mb-4 md:hidden trip-edit-content">
      <button
        (click)="showBankView()"
        [class.bg-tp-orange]="currentMobileView() === 'bank'"
        [class.text-white]="currentMobileView() === 'bank'"
        [class.bg-tp-bg-light-quaternary]="currentMobileView() !== 'bank'"
        [class.dark:bg-tp-bg-quaternary]="currentMobileView() !== 'bank'"
        class="flex-1 px-4 py-2 text-sm font-medium border-r border-tp-border-light dark:border-tp-border transition-colors duration-200">
        Search
      </button>
      <button
        (click)="showItineraryView()"
        [class.bg-tp-orange]="currentMobileView() === 'itinerary'"
        [class.text-white]="currentMobileView() === 'itinerary'"
        [class.bg-tp-bg-light-quaternary]="currentMobileView() !== 'itinerary'"
        [class.dark:bg-tp-bg-quaternary]="currentMobileView() !== 'itinerary'"
        class="flex-1 px-4 py-2 text-sm font-medium transition-colors duration-200">
        Itinerary
      </button>
    </div>

    <!-- Desktop Layout -->
    <div class="hidden md:block trip-edit-content">

      <!-- Location Search - Top Section -->
      <div class="flex gap-6 mb-6 transition-all duration-300 ease-in-out">
        <!-- Empty space for bank when visible -->
        <div class="transition-all duration-300 ease-in-out" [ngClass]="{'w-1/3': !isLocationBankEmpty(), 'w-0': isLocationBankEmpty(), 'opacity-0': isLocationBankEmpty(), 'overflow-hidden': isLocationBankEmpty()}">
        </div>

        <!-- Location Search aligned with itinerary -->
        <div class="transition-all duration-300 ease-in-out" [ngClass]="{'w-2/3': !isLocationBankEmpty(), 'w-full': isLocationBankEmpty()}">
          <app-location-search
            (locationSelected)="onLocationSelected($event)">
          </app-location-search>
        </div>
      </div>

      <!-- Bank & Itinerary - Bottom Section -->
      <div class="flex gap-6 transition-all duration-300 ease-in-out">

        <!-- Left Column: Bank -->
        <div class="transition-all duration-300 ease-in-out" [ngClass]="{'w-1/3': !isLocationBankEmpty(), 'w-0': isLocationBankEmpty(), 'opacity-0': isLocationBankEmpty(), 'overflow-hidden': isLocationBankEmpty()}">
          <app-location-bank
            listId="desktop-bank-list"
            [connectedDropLists]="['desktop-itinerary-list']"
            [bankedLocations]="bankedLocationsForBank()"
            (dragStarted)="onLocationDragStarted($event)"
            (addToItinerary)="onLocationAddedToItinerary($event)"
            (locationRemovedFromBank)="onLocationRemovedFromBank($event)"
            (itemDroppedFromItinerary)="onStopDroppedToBank($event)">
          </app-location-bank>
        </div>

        <!-- Right Column: Itinerary -->
        <div class="transition-all duration-300 ease-in-out" [ngClass]="{'w-2/3': !isLocationBankEmpty(), 'w-full': isLocationBankEmpty()}">
          <app-itinerary-builder
            listId="desktop-itinerary-list"
            [connectedDropLists]="['desktop-bank-list']"
            [itineraryStops]="itineraryStops()"
            [matrixData]="matrixData()"
            (stopsReordered)="onItineraryReorder($event)"
            (removeStopRequested)="onStopRemoved($event)"
            (editStopRequested)="onStopEditRequested($event)"
            (itemDroppedFromOtherList)="onLocationDroppedFromBank($event)">
          </app-itinerary-builder>

          <!-- Desktop Save Button -->
          <div class="mt-6 flex justify-end">
            <button
              (click)="handleTripSave()"
              [disabled]="isLoading()"
              class="flex items-center gap-2 px-6 py-3 bg-tp-orange hover:bg-tp-orange-dark text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">
              @if (isLoading()) {
                <i class="pi pi-spin pi-spinner text-sm"></i>
              } @else {
                <i class="pi pi-save text-sm"></i>
              }
              <span>Save Trip</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Layout -->
    <div class="md:hidden">

      <!-- Bank View -->
      @if (currentMobileView() === 'bank') {
        <div class="trip-edit-content">
          <!-- Location Search -->
          <div class="mb-6">
            <app-location-search
              (locationSelected)="onLocationSelected($event)">
            </app-location-search>
          </div>

          <!-- Location Bank -->
          <div>
            <app-location-bank
              listId="mobile-bank-list"
              [connectedDropLists]="['mobile-itinerary-list']"
              [bankedLocations]="bankedLocationsForBank()"
              (dragStarted)="onLocationDragStarted($event)"
              (addToItinerary)="onLocationAddedToItinerary($event)"
              (itemDroppedFromItinerary)="onStopDroppedToBank($event)">
            </app-location-bank>
          </div>
        </div>
      }

      <!-- Itinerary View -->
      @if (currentMobileView() === 'itinerary') {
        <div class="trip-edit-content">
          <app-itinerary-builder
            listId="mobile-itinerary-list"
            [connectedDropLists]="['mobile-bank-list']"
            [itineraryStops]="itineraryStops()"
            [matrixData]="matrixData()"
            (stopsReordered)="onItineraryReorder($event)"
            (removeStopRequested)="onStopRemoved($event)"
            (editStopRequested)="onStopEditRequested($event)">
          </app-itinerary-builder>
        </div>
      }
    </div>

    <!-- Mobile Action Buttons -->
    <div class="md:hidden fixed bottom-4 right-4 z-40 flex gap-3">
      <!-- Save Trip Button -->
      <button
        (click)="handleTripSave()"
        [disabled]="isLoading()"
        class="flex items-center gap-2 px-4 py-3 bg-tp-orange hover:bg-tp-orange/90 text-white font-medium rounded-full shadow-lg hover:shadow-xl transition-all duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed button-press hover-lift">
        @if (isLoading()) {
          <i class="pi pi-spin pi-spinner text-sm"></i>
        } @else {
          <i class="pi pi-save text-sm"></i>
        }
        <span class="text-sm">Save</span>
      </button>

      <!-- Trip Details Button -->
      <button
        (click)="openTripDetails()"
        class="p-3 bg-tp-orange hover:bg-tp-orange/90 text-white rounded-full shadow-lg hover:shadow-xl transition-all duration-200 ease-in-out button-press hover-lift"
        aria-label="Open trip details">
        <i class="pi pi-cog text-lg"></i>
      </button>
    </div>

    <!-- Stop Edit Modal -->
    @if (editingStop()) {
      <app-stop-edit-modal
        [stop]="editingStop()!"
        [isOpen]="isStopEditModalOpen()"
        (closeModal)="onStopEditModalClose()"
        (stopUpdated)="onStopUpdated($event)">
      </app-stop-edit-modal>
    }
  </div>
} @else if (error()) {
  <div class="p-6 text-center">
    <p class="text-lg text-red-600 dark:text-red-400">{{ error() }}</p>
  </div>
} @else {
  <div class="p-6 text-center">
    <p class="text-lg text-red-600 dark:text-red-400">Could not load trip data.</p>
    <p class="text-sm text-gray-500 mt-2">Data source: {{ dataSource() }}</p>
  </div>
}
