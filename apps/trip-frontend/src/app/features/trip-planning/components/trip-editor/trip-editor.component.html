<div class="container mx-auto p-4 md:p-6 space-y-6 bg-tp-bg-light dark:bg-tp-bg-primary">
  <!-- Trip Edit Controls -->
  <div class="mb-6">
    <app-trip-edit-controls
      [trip]="currentTrip()"
      [disabled]="false"
      (tripDataChanged)="onTripDataChanged($event)"
    />
  </div>

  <!-- Top section: Location Search -->
  <div class="grid grid-cols-1 md:grid-cols-5 gap-6 mb-6">
    <!-- Left column: Location Search -->
    <div class="md:col-span-2">
      <app-location-search (locationSelected)="onLocationSelectedFromSearch($event)">
      </app-location-search>
    </div>

    <!-- Right column: Placeholder for future content -->
    <div class="md:col-span-3">
      <!-- This space can be used for additional trip planning tools -->
    </div>
  </div>

  <!-- Bottom section: Location Bank and Itinerary Builder -->
  <div class="grid grid-cols-1 md:grid-cols-5 gap-6" cdkDropListGroup>
    <div class="md:col-span-2">
      <app-location-bank
        [bankedLocations]="bankedLocationsList()"
        [listId]="'bank-list'"
        [connectedDropLists]="['itinerary-list']"
        (dragStarted)="handleBankDragStart($event)"
      >
      </app-location-bank>
    </div>

    <div class="md:col-span-3">
      <app-itinerary-builder
        [itineraryStops]="itineraryStops()"
        [matrixData]="matrixData()"
        [listId]="'itinerary-list'"
        [connectedDropLists]="['bank-list']"
        (itemDroppedFromOtherList)="handleItemDroppedFromBank($event)"
        (stopsReordered)="handleStopsReordered($event)"
        (removeStopRequested)="handleRemoveStopRequest($event)"
        (editStopRequested)="handleEditStopRequest($event)"
      >
      </app-itinerary-builder>
    </div>
  </div>

  @if (tripId()) {
    <footer class="mt-8 pt-4 border-t border-tp-border-light dark:border-tp-border">
      <app-button
        variant="primary"
        size="md"
        (buttonClick)="saveTrip()"
      >
        Save Trip
      </app-button>
    </footer>
  }

  <!-- Stop Edit Modal -->
  @if (editingStop()) {
    <app-stop-edit-modal
      [stop]="editingStop()!"
      [isOpen]="isStopEditModalOpen()"
      (closeModal)="handleStopEditModalClose()"
      (stopUpdated)="handleStopUpdated($event)"
    />
  }
</div>
