<div class="timeline-container-wrapper h-full">
  @if (isLoading()) {
    <div class="flex items-center justify-center h-full">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
        <p class="text-tp-text-light-secondary dark:text-tp-text-secondary">Loading trip timeline...</p>
      </div>
    </div>
  } @else if (error()) {
    <div class="flex items-center justify-center h-full">
      <div class="text-center">
        <i class="pi pi-exclamation-triangle text-4xl text-red-500 mb-4"></i>
        <h3 class="text-lg font-semibold text-tp-text-light-primary dark:text-tp-text-primary mb-2">Error Loading Timeline</h3>
        <p class="text-tp-text-light-secondary dark:text-tp-text-secondary">{{ error() }}</p>
      </div>
    </div>
  } @else if (trip()) {
    <!-- View Navigation -->
    <div class="flex mb-6 border-b border-tp-border-light dark:border-tp-border px-6">
      <button
        (click)="navigateToPlanningView()"
        class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-tp-text-light-secondary dark:text-tp-text-secondary
               hover:text-tp-text-light-primary dark:hover:text-tp-text-primary hover:border-tp-border-light dark:hover:border-tp-border
               transition-colors duration-150">
        Planning View
      </button>
      <button
        class="px-4 py-2 text-sm font-medium border-b-2 border-tp-orange text-tp-orange transition-colors duration-150">
        Timeline View
      </button>
    </div>

    <app-timeline-view />
  } @else {
    <div class="flex items-center justify-center h-full">
      <div class="text-center">
        <i class="pi pi-info-circle text-4xl text-gray-400 mb-4"></i>
        <p class="text-tp-text-light-secondary dark:text-tp-text-secondary">No trip data available</p>
      </div>
    </div>
  }
</div>
