<header
  [class]="headerClasses()"
>
  <div class="flex items-center justify-between w-full px-6">
    <!-- Mobile Hamburger Menu (only visible on mobile when authenticated) -->
    @if (isAuthenticated()) {
      <button
        (click)="onToggleMobileSidebar()"
        class="p-2 rounded-lg hover:bg-tp-bg-light-tertiary dark:hover:bg-tp-bg-tertiary transition-colors duration-200 md:hidden"
      >
        <svg
          class="w-6 h-6 text-tp-text-light-primary dark:text-tp-text-primary"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </button>
    }

    <!-- Logo and Title with left edge spacing -->
    <div class="flex items-center gap-8">
      <!-- Welcome text -->
      @if (isAuthenticated()) {
        <span class="text-sm whitespace-nowrap text-text-muted dark:text-tp-text-secondary hidden md:block"
          >Welcome, {{ userDisplayName() }}</span
        >
      }
    </div>

    <!-- Right Side Actions -->
    <div class="flex items-center gap-4">
      <!-- Theme Toggle -->
      <app-theme-toggle></app-theme-toggle>

      <!-- Authenticated User View -->
      @if (isAuthenticated()) {
        <!-- Profile Avatar with Dropdown -->
        <div class="relative" #profileContainer>
          <button
            (click)="toggleProfileDropdown()"
            class="bg-transparent border-none p-0 cursor-pointer rounded-full transition-opacity duration-200 hover:opacity-80"
            #profileTrigger
          >
            <app-avatar
              [src]="userAvatarUrl()"
              [alt]="userDisplayName() + ' avatar'"
              size="sm"
              [showBorder]="true"
            ></app-avatar>
          </button>

          <app-dropdown
            [items]="profileDropdownItems"
            [isOpen]="isProfileDropdownOpen"
            [triggerElement]="profileTrigger"
            (closeDropdown)="closeProfileDropdown()"
          ></app-dropdown>
        </div>
      } @else {
        <!-- Unauthenticated User View -->
        <div class="flex items-center gap-2">
          <app-button variant="ghost" size="sm" (buttonClick)="onLogin()"> Sign In </app-button>
          <app-button variant="primary" size="sm" (buttonClick)="onRegister()">
            Register
          </app-button>
        </div>
      }
    </div>
  </div>
</header>
