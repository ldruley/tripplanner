<div class="min-h-screen bg-tp-bg-light-primary dark:bg-tp-bg-primary py-8 px-4">
  <div class="max-w-4xl mx-auto bg-tp-bg-light-primary dark:bg-tp-bg-secondary shadow-sm rounded-lg p-6">
    <!-- Header -->
    <div class="text-center mb-8">
      <h2 class="text-xl font-semibold text-tp-text-light-primary dark:text-tp-text-primary mb-2">User Settings</h2>
      <p class="text-tp-text-light-secondary dark:text-tp-text-secondary mb-6">
        Manage your preferences and display options.
      </p>
    </div>


    <!-- Settings Form -->
    <app-settings-form
      [form]="vm().form"
      [loading]="vm().loading"
      [error]="vm().error"
      (saveRequested)="onSave()"
      (cancelRequested)="onCancel()"
    >
    </app-settings-form>
  </div>
</div>
