<div class="app-layout">
  @if (isAuthenticated$ | async) {
    <!-- Sidebar -->
    <app-sidebar 
      #sidebarRef 
      (expandedChange)="onSidebarExpandedChange($event)">
    </app-sidebar>
    
    <!-- Main Content Area -->
    <div [class]="mainContainerClasses()">
      <!-- Header -->
      <app-header [sidebarExpanded]="sidebarExpanded()" (toggleMobileSidebar)="onToggleMobileSidebar()"></app-header>
      
      <!-- Main Content -->
      <main class="main-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  } @else {
    <!-- Non-authenticated layout -->
    <div class="auth-layout">
      <main class="auth-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  }
</div>

<p-toast position="bottom-right" [baseZIndex]="5000"></p-toast>
