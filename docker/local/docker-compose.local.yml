version: '3.8'

include:
  - ../common/docker-compose.base.yml

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
      target: base
    container_name: trip-planner-backend-dev
    env_file:
      - ../../.env
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DATABASE_USER:-trip_planner_user}:${DATABASE_PASSWORD:-trip_planner_password}@postgres:5432/${DATABASE_NAME:-trip_planner}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - HERE_API_KEY=${HERE_API_KEY}
      - MAPBOX_API_KEY=${MAPBOX_API_KEY}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx nx run prisma:db:generate && npx nx serve trip-backend"
    networks:
      - trip-planner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      target: base
    container_name: trip-planner-frontend-dev
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
    ports:
      - "4200:4200"
    command: sh -c "npx nx serve trip-frontend --host 0.0.0.0"
    networks:
      - trip-planner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s