version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trip-planner-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-trip_planner}
      POSTGRES_USER: ${DATABASE_USER:-trip_planner_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-trip_planner_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-trip_planner_user} -d ${DATABASE_NAME:-trip_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trip-planner-network

  redis:
    image: redis:7-alpine
    container_name: trip-planner-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - trip-planner-network

volumes:
  postgres_data:
  redis_data:

networks:
  trip-planner-network:
    driver: bridge